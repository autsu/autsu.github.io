<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">一条直线和四个样本</title>
  <desc id="desc">坐标图中的四个橙色样本落在蓝色直线 y 等于 3x 加 2 上。</desc>
  <rect width="720" height="420" rx="20" fill="#fffaf0"/>
  <line x1="90" y1="350" x2="670" y2="350" stroke="#6f6255" stroke-width="3"/>
  <line x1="90" y1="350" x2="90" y2="45" stroke="#6f6255" stroke-width="3"/>
  <line x1="100" y1="325" x2="620" y2="65" stroke="#356b8c" stroke-width="6"/>
  <g fill="#d47b38" stroke="#fffaf0" stroke-width="5">
    <circle cx="120" cy="305" r="11"/>
    <circle cx="270" cy="225" r="11"/>
    <circle cx="420" cy="145" r="11"/>
    <circle cx="570" cy="65" r="11"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#4b4138">
    <text x="640" y="377" font-size="22">x</text>
    <text x="62" y="55" font-size="22">y</text>
    <text x="475" y="105" font-size="24" fill="#356b8c">y = 3x + 2</text>
    <text x="105" y="385" font-size="17">0</text>
    <text x="255" y="385" font-size="17">1</text>
    <text x="405" y="385" font-size="17">2</text>
    <text x="555" y="385" font-size="17">3</text>
  </g>
</svg>
